<!-- 3. 主持人展示 -->
  <section id="view-host-game" class="card view-section">
    <div class="game-top-bar">
      <div class="badge" data-i18n="badge_guessing">當前環節：猜猜誰是假話</div>
      <span class="game-host-tag">🎙️ 現場主持：<b id="game-host-name">Jacky</b></span>
    </div>
    
    <h2 class="presenter-heading"><span id="host-current-name" class="text-primary"></span> <span data-i18n="txt_sharing_suffix">的分享</span></h2>
    
    <!-- 90秒三段式軟計時器 -->
    <div class="soft-timer-wrap">
      <div class="soft-timer-label">
        <span data-i18n="lbl_chat_time">提問交流時間 (建議 90s)</span>
        <span id="host-timer-text">01:30</span>
      </div>
      <div class="soft-timer-bar"><div id="host-timer-fill" class="soft-timer-fill"></div></div>
    </div>

    <!-- 視覺焦點 1: 題目卡片 -->
    <div id="host-statements-display"></div>

    <!-- 視覺焦點 2: 題目下方呈現投票進度 -->
    <div id="host-vote-progress" class="vote-progress-bar">
      已投票：<span id="host-voted-count">0</span> / <span id="host-total-voters">0</span> 人
      <span id="host-pending-list" class="vote-pending-names"></span>
    </div>

    <!-- 視覺焦點 3: 行動按鈕 -->
    <button id="btn-host-reveal" class="btn btn-success" onclick="hostRevealCurrent()" data-i18n="btn_reveal">揭曉答案</button>
    <button id="btn-host-back" class="btn btn-secondary is-hidden" onclick="uiBackToLobby()" data-i18n="btn_next_person">下一位主角</button>

    <div id="host-story-box" class="story-box is-hidden">
      <h4 class="story-title" data-i18n="lbl_story_title">背後故事分享：</h4>
      <p id="host-story-content" class="story-content"></p>
    </div>
  </section>
